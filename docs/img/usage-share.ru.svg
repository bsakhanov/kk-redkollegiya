<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="t" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'DejaVu Sans', sans-serif">
<title id="t">Узус выбрал казахское слово в 20 парах из 25; в трёх автор оставил международное</title>
<rect width="760" height="640" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Узус выбрал казахское слово в 20 парах из 25; в трёх автор оставил международное</text>
<text x="24" y="52" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Доля казахской формы среди вхождений пары в корпусе из 840 тысяч слов, %</text>
<rect x="24" y="60" width="10" height="10" rx="2" fill="#2563eb"/>
<text x="42" y="69" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">синий — слова, которые автор оставил международными вопреки узусу</text>

- {key: rhythm, ru: "ритм", a: {label: "ритм", re: "ритм\\w*"}, b: {label: "ырғақ", re: "ырғақ\\w*"}, parity_ru: "ритм\\w*"}
- {key: operational, ru: "оперативность", a: {label: "оперативность", re: "оперативност\\w*"}, b: {label: "жеделдік", re: "жеделдік\\w*|жеделдіг\\w*"}, parity_ru: "оперативност\\w*"}

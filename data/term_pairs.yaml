# Пары «международная (русская) форма — казахская форма». a — международная форма в казахском тексте, b — казахская.
# Нужны для политики «узус корпуса; международное — только там, где узус молчит» (tools/kk_usage.py).
# parity_ru — как понятие выглядит в русском оригинале (для проверки PR06 в kk_parity).
- {key: object,        ru: объект,        a: {label: объект,        re: "объект\\w*"},                 b: {label: нысан,          re: "нысан\\w*"},                     parity_ru: "объект\\w*"}
- {key: project,       ru: проект,        a: {label: проект,        re: "проект\\w*"},                 b: {label: жоба,           re: "жоба\\w*"},                      parity_ru: "проект\\w*"}
- {key: partner,       ru: партнёр,       a: {label: партнёр,       re: "партн[её]р\\w*"},             b: {label: серіктес,       re: "серіктес\\w*"},                  parity_ru: "партн[её]р\\w*"}
- {key: concept,       ru: концепция,     a: {label: концепция,     re: "концепци\\w*"},               b: {label: тұжырымдама,    re: "тұжырымдама\\w*"},               parity_ru: "концепци\\w*"}
- {key: digital,       ru: цифровой,      a: {label: цифрлық,       re: "цифрл[ыі]\\w*|цифрлық\\w*"},  b: {label: сандық,         re: "сандық\\w*"},                    parity_ru: "цифров\\w*"}
- {key: ai,            ru: искусственный интеллект, a: {label: жасанды интеллект, re: "жасанды\\s+интеллект\\w*"}, b: {label: жасанды зерде, re: "жасанды\\s+зерде\\w*"}, parity_ru: "искусственн\\w+\\s+интеллект\\w*"}
- {key: well,          ru: скважина,      a: {label: скважина,      re: "скважин\\w*"},                b: {label: ұңғыма,         re: "ұңғыма\\w*"},                    parity_ru: "скважин\\w*"}
- {key: field,         ru: месторождение, a: {label: месторождение, re: "месторожден\\w*"},            b: {label: кен орны,       re: "кен\\s+орн\\w*|кен\\s+орын\\w*"}, parity_ru: "месторожден\\w*"}
- {key: drilling,      ru: бурение,       a: {label: бурение,       re: "бурени\\w*"},                 b: {label: бұрғылау,       re: "бұрғыла\\w*"},                   parity_ru: "бурени\\w*|бурят\\w*|буров\\w*"}
- {key: refining,      ru: нефтепереработка, a: {label: нефтепереработка, re: "нефтепереработ\\w*"},    b: {label: мұнай өңдеу,    re: "мұнай\\s+өңдеу\\w*"},            parity_ru: "нефтепереработ\\w*|нефтеперерабатыва\\w*"}
- {key: petrochem,     ru: нефтехимия,    a: {label: нефтехимия,    re: "нефтехими\\w*"},              b: {label: мұнайхимия,     re: "мұнай-?хими\\w*"},               parity_ru: "нефтехими\\w*"}
- {key: enterprise,    ru: предприятие,   a: {label: предприятие,   re: "предприяти\\w*"},             b: {label: кәсіпорын,      re: "кәсіпорын\\w*"},                 parity_ru: "предприяти\\w*"}
- {key: indicator,     ru: показатель,    a: {label: показатель,    re: "показател\\w*|индикатор\\w*"}, b: {label: көрсеткіш,      re: "көрсеткіш\\w*"},                 parity_ru: "показател\\w*|индикатор\\w*"}
- {key: initiative,    ru: инициатива,    a: {label: инициатива,    re: "инициатив\\w*"},              b: {label: бастама,        re: "бастама\\w*"},                   parity_ru: "инициатив\\w*"}
- {key: modernization, ru: модернизация,  a: {label: модернизация,  re: "модернизаци\\w*"},            b: {label: жаңғырту,       re: "жаңғырт\\w*"},                   parity_ru: "модернизаци\\w*"}
- {key: labor-safety,  ru: охрана труда,  a: {label: охрана труда,  re: "охран\\w*\\s+труд\\w*"},      b: {label: еңбекті қорғау, re: "еңбекті\\s+қорғау\\w*"},         parity_ru: "охран\\w*\\s+труд\\w*"}
- {key: equipment,     ru: оборудование,  a: {label: оборудование,  re: "оборудовани\\w*"},            b: {label: жабдық,         re: "жабдық\\w*"},                    parity_ru: "оборудовани\\w*"}
- {key: capacity,      ru: мощность,      a: {label: мощность,      re: "мощност\\w*"},                b: {label: қуат,           re: "қуат\\w*"},                      parity_ru: "мощност\\w*"}
- {key: pipeline,      ru: трубопровод,   a: {label: трубопровод,   re: "трубопровод\\w*"},            b: {label: құбыр,         re: "құбыр\\w*"},                     parity_ru: "трубопровод\\w*"}
- {key: abbr-country,  ru: РК,            a: {label: РК,            re: "рк"},                         b: {label: ҚР,            re: "қр"},                            parity_ru: "\\bрк\\b"}
- {key: abbr-ltd,      ru: ТОО,           a: {label: ТОО,           re: "тоо"},                        b: {label: ЖШС,           re: "жшс"},                           parity_ru: "\\bтоо\\b"}
- {key: abbr-refinery, ru: НПЗ,           a: {label: НПЗ,           re: "нпз"},                        b: {label: МӨЗ,           re: "мөз"},                           parity_ru: "\\bнпз\\b"}
# Цифровая лексика: здесь узус может молчать, и тогда по решению автора берётся международная форма.
- {key: website,      ru: сайт,          a: {label: сайт,          re: "сайт\\w*"},                   b: {label: торап,          re: "торап\\w*"},                     parity_ru: "\\bсайт\\w*"}
- {key: application,  ru: приложение,    a: {label: мобильді қосымша, re: "мобильд\\w+\\s+қосымша\\w*"}, b: {label: қолданба,   re: "қолданба\\w*"},                  parity_ru: "мобильн\\w+\\s+приложени\\w*"}
- {key: database,     ru: база данных,   a: {label: деректер базасы, re: "деректер\\s+базасы\\w*"},    b: {label: дерекқор,       re: "дерекқор\\w*"},                  parity_ru: "баз\\w+\\s+данных"}

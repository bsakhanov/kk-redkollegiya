# Пары «международная (русская) форма — казахская форма». a — международная форма в казахском тексте, b — казахская.
# Нужны для политики «узус корпуса; международное — только там, где узус молчит» (tools/kk_usage.py).
# parity_ru — как понятие выглядит в русском оригинале (для проверки PR06 в kk_parity).
- {key: object,        ru: объект,        a: {label: объект,        re: "объект\\w*"},                 b: {label: нысан,          re: "нысан\\w*"},                     parity_ru: "объект\\w*"}
- {key: project,       ru: проект,        a: {label: проект,        re: "проект\\w*"},                 b: {label: жоба,           re: "жоба\\w*"},                      parity_ru: "проект\\w*", avoid_exclude: ["проектор\\w*", "проектиров\\w*"]}
- {key: partner,       ru: партнёр,       a: {label: партнёр,       re: "партн[её]р\\w*"},             b: {label: серіктес,       re: "серіктес\\w*"},                  parity_ru: "партн[её]р\\w*"}
- {key: concept,       ru: концепция,     a: {label: концепция,     re: "концепци\\w*"},               b: {label: тұжырымдама,    re: "тұжырымдама\\w*"},               parity_ru: "концепци\\w*"}
- {key: digital,       ru: цифровой,      a: {label: цифрлық,       re: "цифрл[ыі]\\w*|цифрлық\\w*"},  b: {label: сандық,         re: "сандық\\w*"},                    parity_ru: "цифров\\w*", avoid_exclude: ["сандық\\s+(?:көрсеткіш|мән|бағалау|шама)\\w*"], note: "«сандық» бывает и «числовой» («сандық көрсеткіш»), такие случаи не флагуются"}
- {key: ai,            ru: искусственный интеллект, a: {label: жасанды интеллект, re: "жасанды\\s+интеллект\\w*"}, b: {label: жасанды зерде, re: "жасанды\\s+зерде\\w*"}, parity_ru: "искусственн\\w+\\s+интеллект\\w*"}
- {key: well,          ru: скважина,      a: {label: скважина,      re: "скважин\\w*"},                b: {label: ұңғыма,         re: "ұңғыма\\w*"},                    parity_ru: "скважин\\w*"}
- {key: field,         ru: месторождение, a: {label: месторождение, re: "месторожден\\w*"},            b: {label: кен орны,       re: "кен\\s+орн\\w*|кен\\s+орын\\w*"}, parity_ru: "месторожден\\w*"}
- {key: drilling,      ru: бурение,       a: {label: бурение,       re: "бурени\\w*"},                 b: {label: бұрғылау,       re: "бұрғыла\\w*"},                   parity_ru: "бурени\\w*|бурят\\w*|буров\\w*"}
- {key: refining,      ru: нефтепереработка, a: {label: нефтепереработка, re: "нефтепереработ\\w*"},    b: {label: мұнай өңдеу,    re: "мұнай\\s+өңдеу\\w*"},            parity_ru: "нефтепереработ\\w*|нефтеперерабатыва\\w*"}
- {key: petrochem,     ru: нефтехимия,    a: {label: нефтехимия,    re: "нефтехими\\w*"},              b: {label: мұнайхимия,     re: "мұнай-?хими\\w*"},               parity_ru: "нефтехими\\w*"}
- {key: enterprise,    ru: предприятие,   a: {label: предприятие,   re: "предприяти\\w*"},             b: {label: кәсіпорын,      re: "кәсіпорын\\w*"},                 parity_ru: "предприяти\\w*"}
- {key: indicator,     ru: показатель,    a: {label: показатель,    re: "показател\\w*|индикатор\\w*"}, b: {label: көрсеткіш,      re: "көрсеткіш\\w*"},                 parity_ru: "показател\\w*|индикатор\\w*"}
- {key: initiative,    ru: инициатива,    a: {label: инициатива,    re: "инициатив\\w*"},              b: {label: бастама,        re: "бастама\\w*"},                   parity_ru: "инициатив\\w*"}
- {key: modernization, ru: модернизация,  a: {label: модернизация,  re: "модернизаци\\w*"},            b: {label: жаңғырту,       re: "жаңғырт\\w*"},                   parity_ru: "модернизаци\\w*"}
- {key: labor-safety,  ru: охрана труда,  a: {label: охрана труда,  re: "охран\\w*\\s+труд\\w*"},      b: {label: еңбекті қорғау, re: "еңбекті\\s+қорғау\\w*"},         parity_ru: "охран\\w*\\s+труд\\w*"}
- {key: equipment,     ru: оборудование,  a: {label: оборудование,  re: "оборудовани\\w*"},            b: {label: жабдық,         re: "жабдық\\w*"},                    parity_ru: "оборудовани\\w*"}
- {key: capacity,      ru: мощность,      a: {label: мощность,      re: "мощност\\w*"},                b: {label: қуат,           re: "қуат\\w*"},                      parity_ru: "мощност\\w*"}
- {key: pipeline,      ru: трубопровод,   a: {label: трубопровод,   re: "трубопровод\\w*"},            b: {label: құбыр,         re: "құбыр\\w*"},                     parity_ru: "трубопровод\\w*"}
- {key: abbr-country,  ru: РК,            a: {label: РК,            re: "рк"},                         b: {label: ҚР,            re: "қр"},                            parity_ru: "\\bрк\\b"}
- {key: abbr-ltd,      ru: ТОО,           a: {label: ТОО,           re: "тоо"},                        b: {label: ЖШС,           re: "жшс"},                           parity_ru: "\\bтоо\\b"}
- {key: abbr-refinery, ru: НПЗ,           a: {label: НПЗ,           re: "нпз"},                        b: {label: МӨЗ,           re: "мөз"},                           parity_ru: "\\bнпз\\b"}
# Цифровая лексика: здесь узус может молчать, и тогда по решению автора берётся международная форма.
- {key: website,      ru: сайт,          a: {label: сайт,          re: "сайт\\w*"},                   b: {label: торап,          re: "торап\\w*"},                     parity_ru: "\\bсайт\\w*", no_avoid: true, note: "«торап» в корпусе почти всегда значит «узел, блок» («желілік торап», «логистикалық торап»), в значении «сайт» не встречается, поэтому не запрещается"}
- {key: application,  ru: приложение,    a: {label: мобильді қосымша, re: "мобильд\\w+\\s+қосымша\\w*"}, b: {label: қолданба,   re: "қолданба\\w*"},                  parity_ru: "мобильн\\w+\\s+приложени\\w*"}
- {key: database,     ru: база данных,   a: {label: деректер базасы, re: "деректер\\s+базасы\\w*"},    b: {label: дерекқор,       re: "дерекқор\\w*"},                  parity_ru: "баз\\w+\\s+данных"}
# Технические термины (решения автора от 14.10.2026; см. glossary.yaml)
- {key: mounting, ru: "монтажный", a: {label: "монтажный", re: "монтажн\\w*"}, b: {label: "монтаж", re: "монтаж(?!н)\\w*"}, parity_ru: "монтажн\\w*"}
- {key: chain, ru: "цепочка", a: {label: "цепочка", re: "цепочк\\w*"}, b: {label: "тізбек", re: "тізбек\\w*"}, parity_ru: "цепочк\\w*"}
- {key: gas-pipeline, ru: "газопровод", a: {label: "газопровод", re: "газопровод\\w*"}, b: {label: "газ құбыры", re: "газ\\s+құбыр\\w*"}, parity_ru: "газопровод\\w*"}
- {key: electrical-equipment, ru: "электрооборудование", a: {label: "электрооборудование", re: "электрооборудовани\\w*"}, b: {label: "электр жабдығы", re: "электр\\s*жабдық\\w*|электр\\s*жабдығ\\w*"}, parity_ru: "электрооборудовани\\w*"}
- {key: failure, ru: "сбой", a: {label: "сбой", re: "сбо[йя]\\w*|сбои\\w*"}, b: {label: "іркіліс", re: "іркіліс\\w*"}, parity_ru: "сбо[йя]\\w*|сбои\\w*"}
- {key: day-off, ru: "выходной день", a: {label: "выходной день", re: "выходн\\w+\\s+д\\w+"}, b: {label: "демалыс күні", re: "демалыс\\s+күн\\w*"}, parity_ru: "выходн\\w+\\s+д\\w+"}
- {key: freight-turnover, ru: "грузооборот", a: {label: "грузооборот", re: "грузооборот\\w*"}, b: {label: "жүк айналымы", re: "жүк\\s+айналым\\w*"}, parity_ru: "грузооборот\\w*"}
- {key: mechanical-engineering, ru: "машиностроение", a: {label: "машиностроение", re: "машиностроени\\w*"}, b: {label: "машина жасау", re: "машина\\s*жасау\\w*"}, parity_ru: "машиностроени\\w*"}
- {key: load-capacity, ru: "грузоподъёмность", a: {label: "грузоподъёмность", re: "грузоподъ[её]мност\\w*"}, b: {label: "жүк көтергіш", re: "жүк\\s*көтергіш\\w*"}, parity_ru: "грузоподъ[её]мност\\w*"}
- {key: man-hour, ru: "человеко-час", a: {label: "человеко-час", re: "человеко[\\s-]*час\\w*"}, b: {label: "адам-сағат", re: "адам[\\s-]+сағат\\w*"}, parity_ru: "человеко[\\s-]*час\\w*"}
- {key: ecosystem, ru: "экосистема", a: {label: "экосистема", re: "экосистем\\w*"}, b: {label: "экожүйе", re: "экожүйе\\w*"}, parity_ru: "экосистем\\w*"}
- {key: heat-exchanger, ru: "теплообменник", a: {label: "теплообменник", re: "теплообменник\\w*"}, b: {label: "жылу алмастырғыш", re: "жылу\\s*алмастырғыш\\w*"}, parity_ru: "теплообменник\\w*"}
- {key: malfunction, ru: "неисправность", a: {label: "неисправность", re: "неисправност\\w*"}, b: {label: "ақау", re: "ақау\\w*"}, parity_ru: "неисправност\\w*"}
- {key: removal, ru: "вывоз", a: {label: "вывоз", re: "вывоз\\w*"}, b: {label: "әкету", re: "әкету\\w*"}, parity_ru: "вывоз\\w*"}
- {key: shift, ru: "сменный", a: {label: "сменный", re: "сменн\\w*"}, b: {label: "ауысым", re: "ауысым\\w*"}, parity_ru: "сменн\\w*"}
- {key: electric-motor, ru: "электродвигатель", a: {label: "электродвигатель", re: "электродвигател\\w*"}, b: {label: "электр қозғалтқыш", re: "электр\\s*қозғалтқыш\\w*"}, parity_ru: "электродвигател\\w*"}
- {key: scheduled-repair, ru: "плановый ремонт", a: {label: "плановый ремонт", re: "планов\\w+\\s+ремонт\\w*"}, b: {label: "жоспарлы жөндеу", re: "жоспарлы\\s+жөндеу\\w*"}, parity_ru: "планов\\w+\\s+ремонт\\w*"}
- {key: shutoff-valves, ru: "запорная арматура", a: {label: "запорная арматура", re: "запорн\\w+\\s+арматур\\w*"}, b: {label: "бекіту арматурасы", re: "бекіту\\s+арматур\\w*"}, parity_ru: "запорн\\w+\\s+арматур\\w*"}
- {key: hydraulic-fracturing, ru: "гидроразрыв", a: {label: "гидроразрыв", re: "гидроразрыв\\w*"}, b: {label: "гидравликалық жару", re: "гидравликалық\\s+жару\\w*"}, parity_ru: "гидроразрыв\\w*"}
- {key: current-repair, ru: "текущий ремонт", a: {label: "текущий ремонт", re: "текущ\\w+\\s+ремонт\\w*"}, b: {label: "ағымдағы жөндеу", re: "ағымдағы\\s+жөндеу\\w*"}, parity_ru: "текущ\\w+\\s+ремонт\\w*"}
- {key: welder, ru: "сварщик", a: {label: "сварщик", re: "сварщик\\w*"}, b: {label: "дәнекерлеуші", re: "дәнекерле\\w*"}, parity_ru: "сварщик\\w*"}
- {key: appeal, ru: "обращение", a: {label: "обращение", re: "обращени\\w*"}, b: {label: "өтініш", re: "өтініш\\w*"}, parity_ru: "обращени\\w*"}
- {key: length, ru: "протяжённость", a: {label: "протяжённость", re: "протяж[её]нност\\w*"}, b: {label: "ұзындығы", re: "ұзындығ\\w*|ұзындық\\w*"}, parity_ru: "протяж[её]нност\\w*"}
- {key: integrity, ru: "целостность", a: {label: "целостность", re: "целостност\\w*"}, b: {label: "тұтастық", re: "тұтастық\\w*|тұтастығ\\w*"}, parity_ru: "целостност\\w*"}
- {key: burner, ru: "горелка", a: {label: "горелка", re: "горелк\\w*"}, b: {label: "жанарғы", re: "жанарғы\\w*"}, parity_ru: "горелк\\w*"}
- {key: fuel-consumption, ru: "расход топлива", a: {label: "расход топлива", re: "расход\\w*\\s+топлив\\w*"}, b: {label: "отын шығыны", re: "отын\\s+шығын\\w*"}, parity_ru: "расход\\w*\\s+топлив\\w*"}
- {key: supplies, ru: "принадлежности", a: {label: "принадлежности", re: "принадлежност\\w*"}, b: {label: "керек-жарақ", re: "керек[\\s-]*жарақ\\w*"}, parity_ru: "принадлежност\\w*"}
- {key: service-life, ru: "срок службы", a: {label: "срок службы", re: "срок\\w*\\s+служб\\w*"}, b: {label: "қызмет ету мерзімі", re: "қызмет\\s+ету\\s+мерзім\\w*|қызмет\\s+мерзім\\w*"}, parity_ru: "срок\\w*\\s+служб\\w*"}

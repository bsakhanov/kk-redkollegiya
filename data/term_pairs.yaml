- {key: container-ship, ru: "контейнеровоз", a: {label: "контейнеровоз", re: "контейнеровоз\\w*"}, b: {label: "контейнер тасығыш", re: "контейнер\\s*тасығыш\\w*"}, parity_ru: "контейнеровоз\\w*"}

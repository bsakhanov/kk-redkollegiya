# Пары вариантов: русская/международная форма и казахская. Считается частота на 100 тыс. слов по группам.
- {label: "ҚР (сокращение)",              regex: "қр"}
- {label: "РК (русская форма)",           regex: "рк"}
- {label: "ЖШС",                          regex: "жшс"}
- {label: "ТОО (русская форма)",          regex: "тоо"}
- {label: "МӨЗ",                          regex: "мөз"}
- {label: "НПЗ (русская форма)",          regex: "нпз"}
- {label: "нысан-",                       regex: "нысан\\w*"}
- {label: "объект-",                      regex: "объект\\w*"}
- {label: "жоба-",                        regex: "жоба\\w*"}
- {label: "проект-",                      regex: "проект\\w*"}
- {label: "кәсіпорын-",                   regex: "кәсіпорын\\w*"}
- {label: "серіктес-",                    regex: "серіктес\\w*"}
- {label: "партнёр/партнер-",             regex: "партн[её]р\\w*"}
- {label: "бастама-",                     regex: "бастама\\w*"}
- {label: "тұжырымдама-",                 regex: "тұжырымдама\\w*"}
- {label: "концепция-",                   regex: "концепци\\w*"}
- {label: "көрсеткіш-",                   regex: "көрсеткіш\\w*"}
- {label: "цифрлық / цифрлы",             regex: "цифрл[ыі]\\w*|цифрлық\\w*"}
- {label: "сандық",                       regex: "сандық\\w*"}
- {label: "жасанды интеллект",            regex: "жасанды\\s+интеллект\\w*"}
- {label: "жасанды зерде",                regex: "жасанды\\s+зерде\\w*"}
- {label: "қолданба-",                    regex: "қолданба\\w*"}
- {label: "дерекқор-",                    regex: "дерекқор\\w*"}
- {label: "ұңғыма-",                      regex: "ұңғыма\\w*"}
- {label: "кен орын-",                    regex: "кен\\s+орн\\w*|кен\\s+орын\\w*"}
- {label: "бұрғылау-",                    regex: "бұрғыла\\w*"}
- {label: "мұнай өңдеу",                  regex: "мұнай\\s+өңдеу\\w*"}
- {label: "мұнайхимия / мұнай-химия",     regex: "мұнай-?хими\\w*"}
- {label: "полипропилен-",                regex: "полипропилен\\w*"}
- {label: "дизель-",                      regex: "дизель\\w*"}
- {label: "еңбекті қорғау",               regex: "еңбекті\\s+қорғау\\w*"}

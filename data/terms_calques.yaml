# Кандидаты в кальки и штампы: проверяются по корпусу, вердикт — человек (author_choice, не fix).
- {label: "«сонымен қатар»",    regex: "сонымен\\s+қатар"}
- {label: "«тұрғысынан»",       regex: "тұрғысынан"}
- {label: "«жүзеге асыр-»",     regex: "жүзеге\\s+асыр\\w*"}
- {label: "«орын ал-»",         regex: "орын\\s+ал\\w*"}
- {label: "«болып табыл-»",     regex: "болып\\s+табыл\\w*"}
- {label: "«атап өт-»",         regex: "атап\\s+өт\\w*"}
- {label: "«аясында» и формы",  regex: "аяс(?:ында|ынан|ына|ының)"}
- {label: "«қорытындылай келе»", regex: "қорытындылай\\s+келе"}

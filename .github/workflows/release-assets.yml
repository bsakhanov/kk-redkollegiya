#
# Прикладывает к каждому релизу архив kk-redkollegiya-<версия>.zip и его контрольную сумму SHA-256.
#   · при публикации релиза — для его тега;
#   · при правке этого файла в main — для всех существующих тегов v* (однократная доводка прежних релизов);
#   · вручную (Actions → release-assets → Run workflow) — для указанного тега или, если поле пустое, для всех.
# Для тегов, где есть tests/bench/train_kaznerd.py, прикладывает и открытую модель букв lm-kaznerd.json.gz с контрольной суммой.
name: release-assets

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [".github/workflows/release-assets.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.5.0 (пусто — все теги v*)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Собрать архивы и приложить к релизам
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          if [ "$EVENT" = "release" ]; then
            tags="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tags="$INPUT_TAG"
          else
            tags="$(git tag --list 'v*' --sort=v:refname)"
          fi
          for tag in $tags; do
            ver="${tag#v}"
            dir="dist/$tag"
            mkdir -p "$dir"
            git archive --format=zip --prefix="kk-redkollegiya-$ver/" -o "$dir/kk-redkollegiya-$ver.zip" "$tag"
            (cd "$dir" && sha256sum "kk-redkollegiya-$ver.zip" > "kk-redkollegiya-$ver.zip.sha256")
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$dir/kk-redkollegiya-$ver.zip" "$dir/kk-redkollegiya-$ver.zip.sha256" --clobber
              echo "приложено к $tag"
              if git cat-file -e "$tag:tests/bench/train_kaznerd.py" 2>/dev/null; then
                mkdir -p "$dir/src" "$dir/model"
                git archive "$tag" tests tools data | tar -x -C "$dir/src"
                python3 "$dir/src/tests/bench/train_kaznerd.py" --out-dir "$dir/model" --cache "$dir/cache"
                (cd "$dir/model" && sha256sum lm-kaznerd.json.gz > lm-kaznerd.json.gz.sha256)
                gh release upload "$tag" "$dir/model/lm-kaznerd.json.gz" "$dir/model/lm-kaznerd.json.gz.sha256" --clobber
                echo "модель приложена к $tag"
              fi
            else
              echo "у $tag нет релиза: пропуск"
            fi
          done
